<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Field Measure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<script>
  /* Feedback button in the header, before the sync status */
  document.addEventListener('DOMContentLoaded', function () {
    var hdr = document.getElementById('hdr');
    if (hdr && window.BWFeedback) BWFeedback.mount({ app: 'field-measure', into: hdr, before: document.getElementById('sync'),
      client: function () { return window.FMStore && FMStore.client && FMStore.client(); }, version: '2026-11-12',
      extra: function () { return window.FMLog ? FMLog.text() : ''; },
      hint: 'No keyboard? With the Disto paired, the iPhone hides its own: hold the Disto’s arrow key for a second to bring it up, or switch the Disto off while you type.' });
  });
</script>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-height field tool — drawing surface on top, data panel below, keypad rises as a sheet */
:root{
  --bg:#f1f3f2; --surface:#ffffff; --surface-2:#e9ecea;
  --ink:#15181b; --ink-2:#5b6670; --line:#d3d9d6;
  --accent:#ff5a1f; --accent-ink:#ffffff;
  --ok:#1b7a4c; --miss:#c42b1c; --part:#c99700; --grid:#e3e8e5;
  --display:"Barlow Condensed",'Arial Narrow',sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161a; --surface:#1c2126; --surface-2:#262c33;
  --ink:#edf1f3; --ink-2:#95a1aa; --line:#2d353d;
  --accent:#ff7a45; --accent-ink:#1a0d06;
  --ok:#49bd82; --miss:#ff6d5c; --part:#f2c230; --grid:#242b31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13161a; --surface:#1c2126; --surface-2:#262c33;
  --ink:#edf1f3; --ink-2:#95a1aa; --line:#2d353d;
  --accent:#ff7a45; --accent-ink:#1a0d06;
  --ok:#49bd82; --miss:#ff6d5c; --part:#f2c230; --grid:#242b31;
  color-scheme:dark;
}
/* touch-action:manipulation is what stops iOS double-tap from zooming the
   whole app. Pinch is killed separately, in script, so that the one place
   it still works is the full-screen sketch. The canvas overrides this with
   touch-action:none below, because the drawing handles its own pinch and
   drag and must never hand them to the browser. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}

/* A fixed height, and a fixed-width save status: "saving" / "saved" flipping
   after every move used to rewrap the title onto one line or two, and the
   whole screen below it jumped each time. */
header{background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;
  box-sizing:border-box;height:calc(66px + env(safe-area-inset-top,0px));overflow:hidden;
  /* Clear the notch and status bar when running from the home screen. On iOS the
     inset is zero in Safari, so this costs nothing there. */
  padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px}
header h1{font-family:var(--display);font-size:21px;line-height:1.05;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:700;min-width:0}
#hdr{display:flex;align-items:center;gap:8px;min-width:0;flex:0 0 auto}
#sync{font-family:var(--body);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--bg);opacity:.6;white-space:nowrap;display:inline-block;width:6.2em;text-align:right;overflow:hidden;text-overflow:ellipsis}
#sync.ok{opacity:.75}
#sync.warn{opacity:1;color:#ffd4c2}
#jobbtn{font-family:var(--body);font-size:12px;color:var(--bg);background:none;border:1px solid currentColor;
  border-radius:6px;padding:4px 9px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:30}
#modal[hidden]{display:none!important}
/* a box you type into (rename, new room, new floor, new job) sits at the top,
   clear of the phone's keyboard */
#modal.typing{align-items:flex-start}
#modal.typing #modalbox{border-radius:0 0 14px 14px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px}
#modalbox{width:100%;background:var(--surface);border-radius:14px 14px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.mtitle{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.jrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}
.jopen{flex:1;min-width:0;background:none;border:none;text-align:left;color:inherit;padding:0}
.jopen b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jopen small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.jcur b{color:var(--accent)}
.jdel{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink-2);padding:7px 11px;font-size:15px}
.confirm{display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);padding:12px 0}
.confirm .warn{font-size:13.5px;line-height:1.45;color:var(--ink)}
.confirm .warn b{color:var(--miss)}
.crow{display:flex;gap:8px}
.mbtn{border:none;border-radius:9px;padding:13px 10px;font-family:var(--display);font-size:16px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex:1}
.mprimary{background:var(--accent);color:var(--accent-ink)}
.msecondary{background:var(--surface-2);color:var(--ink-2)}
.mdanger{background:var(--miss);color:#fff}
.mwall{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:14.5px;font-weight:600;
  text-align:left;padding:12px 13px}
.chk{font-family:var(--body);font-size:12px;line-height:1.45;color:var(--ink-2);padding:6px 0 2px}
.chk.ok{color:var(--ok);font-weight:600}
.chk.bad{color:var(--miss);font-weight:600}
#jobnameinput{font-family:var(--body);font-size:16px;padding:12px;border:2px solid var(--line);
  border-radius:9px;background:var(--surface-2);color:var(--ink);width:100%}

#modebar{display:flex;gap:1px;background:var(--line);flex:0 0 auto}
.mode{flex:1;background:var(--surface);color:var(--ink-2);border:none;padding:11px 4px 9px;font-family:var(--display);font-size:16px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#shapebar{flex:0 0 auto;display:flex;gap:6px;padding:6px 10px;background:var(--surface);
  border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.chip{flex:0 0 auto;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;font-family:var(--body)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{color:var(--accent);border-color:var(--accent);background:none;font-weight:700}
.chip.untied{border-color:var(--miss);color:var(--miss)}
.chip.on.untied{background:var(--ink);color:var(--bg);border-color:var(--miss)}
/* The hint bar carries the snap setting as well as the hint text. It lives
   above the drawing rather than on top of it, so the chip is reachable in
   every mode and costs no drawing surface. */
/* A fixed height: when a message ran from one line to three the drawing
   below it jumped up and down with it. Three lines always, clipped past that. */
#hint{flex:0 0 auto;display:flex;align-items:center;gap:10px;box-sizing:border-box;height:62px;
  background:var(--surface-2);color:var(--ink-2);font-size:12px;line-height:1.35;
  padding:6px 10px 6px 16px;border-bottom:1px solid var(--line)}
#hinttext{flex:1 1 auto;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
#hint #snap{flex:0 0 auto;padding:5px 12px;font-size:12.5px}
/* plain chip would be the same colour as the bar it sits in */
#hint #snap:not(.on){background:var(--surface)}

#stage{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stagebtns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
.sbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:44px;font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.sbtn[hidden]{display:none!important}
.sbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbtn.off{opacity:.38}
#lock{line-height:0;padding:9px 10px}

#lock svg{display:block;width:19px;height:19px;margin:0 auto}

#tools{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;gap:6px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto;white-space:nowrap;
  background:linear-gradient(to top,var(--surface) 70%,transparent)}
#tools[hidden]{display:none!important}
#tools .chip{flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.14)}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:10;
  max-height:80%;background:var(--surface);border-top:1px solid var(--line);
  border-radius:13px 13px 0 0;box-shadow:0 -7px 22px rgba(0,0,0,.16);
  display:flex;flex-direction:column}
#grip{flex:0 0 auto;height:4px;width:38px;border-radius:2px;background:var(--line);margin:7px auto 3px}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;min-width:0;background:none;border:none;padding:10px 2px 8px;font-family:var(--display);font-size:14px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 16px 14px}

.tally{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:9px 0 5px;position:sticky;top:0;background:var(--surface)}
.tally.done{color:var(--ok)}
.sub{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding:12px 0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;color:inherit}
.row:last-child{border-bottom:none}
.row.indent{padding-left:14px}
.lbl{font-size:14px;min-width:0}
.lbl small{display:block;color:var(--ink-2);font-size:11.5px}
.val{font-family:var(--num);font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.val.empty{color:var(--miss);font-family:var(--body);font-weight:500;font-size:13px}
.empty-state{color:var(--ink-2);font-size:13.5px;line-height:1.5;padding:14px 0}
pre#sumtext{font-family:var(--num);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin:6px 0 0;color:var(--ink)}
#copy{margin-top:12px;width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:11px;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sendrow{display:flex;gap:8px;margin-top:8px}
.sendrow button{flex:1;border:none;border-radius:8px;padding:11px 6px;font-family:var(--display);
  font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.sendrow .primary{background:var(--accent);color:var(--accent-ink)}
.sendrow .second{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
#shotwrap{margin-top:12px}
#shotwrap img{display:block;width:100%;border:1px solid var(--line);border-radius:8px}
#shotwrap .cap{font-family:var(--body);font-size:12.5px;color:var(--ink-2);padding:7px 2px 0;line-height:1.45}
#fullshot{position:fixed;inset:0;z-index:70;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:10px}
#fullshot[hidden]{display:none!important}
#fullshot .stage{position:relative;flex:1 1 auto;width:100%;min-height:0}
#fullshot img{position:absolute;left:50%;top:50%;transform-origin:center center}
#review{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column}
#review[hidden]{display:none!important}
#revbox{flex:1 1 auto;overflow-y:auto;padding:16px 16px 8px}
#revclose{flex:0 0 auto;margin:8px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);border:none;border-radius:9px;padding:13px;
  font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.rvtitle{font-family:var(--display);font-size:24px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding-bottom:2px}
.rvsub{font-family:var(--body);font-size:12.5px;color:var(--ink-2);padding-bottom:12px;line-height:1.45}
.rvhead{font-family:var(--display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700;padding:16px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rvline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}
.rvline .k{font-family:var(--body);font-size:14px;color:var(--ink-2);white-space:nowrap}
.rvline .v{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.rvline .v.gone{color:var(--miss);font-family:var(--body);font-size:14px;font-weight:500}
.rvline small{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink-2);font-weight:400}
.rvnote{font-family:var(--body);font-size:12.5px;color:var(--ink-2);line-height:1.5;padding:4px 0 2px}
.rvnote.ok{color:var(--ok);font-weight:600}
.rvflags{background:var(--surface);border:2px solid var(--miss);border-radius:11px;padding:10px 12px;margin-bottom:6px}
.rvflags .h{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;color:var(--miss);padding-bottom:4px}
.rvflag{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  border-top:1px solid var(--line);padding:11px 0;text-align:left}
.rvflag b{display:block;font-family:var(--body);font-size:14.5px;font-weight:600}
.rvflag small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-2);line-height:1.4;padding-top:2px}
.rvacts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.rvact{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 11px;
  font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--ink-2);white-space:nowrap}
.rvact.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#fullshot .fcap{font-family:var(--body);font-size:13px;color:#5b6670;text-align:center;padding:12px 16px 0}

#statusrow{flex:0 0 auto;display:flex;align-items:stretch;gap:8px;border-top:1px solid var(--line);
  background:var(--surface-2);padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
#status{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:none;background:none;text-align:left;padding:2px 0;
  font-family:var(--body);font-size:12.5px;color:var(--ink-2)}
#backbtn,#revbtn{flex:0 0 auto;background:none;color:var(--ink);border:1px solid var(--ink-2);
  border-radius:8px;padding:7px 11px;font-family:var(--body);font-size:12.5px;font-weight:600;line-height:1.3}
#revbtn{font-size:16px;line-height:1.05;padding:6px 10px}
#backbtn.off,#revbtn.off{color:var(--ink-2);border-color:var(--line);opacity:.4}
#statustext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#findbtn{flex:0 0 auto;background:var(--miss);color:#fff;border:none;border-radius:8px;padding:7px 13px;
  font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#findbtn small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:600;opacity:.9}
#status.clear{color:var(--ok)}
/* Exterior / Interior and ceiling-type choices: room inside the outline,
   so the words don't sit hard against it */
.jrow:has(.sidepick){border-bottom:none;padding:5px 0}
.jopen.sidepick{padding:14px 16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.jopen.sidepick b{font-size:16px}
.jopen.sidepick small{margin-top:5px;line-height:1.4;white-space:normal}
.jopen.sidepick.on{box-shadow:inset 0 0 0 2px var(--accent)}
.fitbtn{display:block;width:100%;margin:6px 0 8px;padding:10px;border-radius:9px;border:1.5px solid var(--accent);
  background:none;color:var(--accent);font-family:var(--display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.chip.sidechip,.chip.floorchip{font-weight:700}
#caret{font-size:11px;opacity:.65;flex:0 0 auto}

#sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20}
#sheet[hidden]{display:none!important}
#sheetbox{width:100%;background:var(--surface);border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:100%;overflow-y:auto}
#sheettitle{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#kinds{display:flex;flex-wrap:wrap;gap:6px}
#kinds[hidden]{display:none!important}
#flagrow{display:flex;gap:6px}
#flagrow[hidden]{display:none!important}
.kchip{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-family:var(--body);font-size:13px;font-weight:600}
.kchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#fields{display:flex;flex-direction:column;gap:11px}
#spanview{padding:2px 0 2px}
#spanview[hidden]{display:none!important}
#spanview svg{display:block;width:100%;height:auto}
#spanview .cap{font-family:var(--body);font-size:11.5px;color:var(--ink-2);padding-top:3px}
#tiltbox[hidden]{display:none!important}
#tiltbox{display:flex;flex-direction:column;gap:8px;
  border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--surface-2)}
.tiltnote{font-family:var(--body);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.tiltnote.bad{color:var(--miss)}
.tiltbtn{background:var(--ink);color:var(--bg);border:none;border-radius:9px;padding:12px;
  font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tiltread{text-align:center;padding:2px 0 0}
.tiltread .big{font-family:var(--num);font-size:34px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.tiltread .deg{font-family:var(--num);font-size:15px;font-weight:600;color:var(--ink-2)}
.tiltread .near{font-family:var(--body);font-size:12.5px;color:var(--ink-2);padding-top:3px}
.tiltread.unsteady .big{color:var(--ink-2)}
.tiltacts{display:flex;gap:8px}
.tiltacts button{flex:1;border:none;border-radius:9px;padding:12px 6px;
  font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tiltuse{background:var(--accent);color:var(--accent-ink)}
.tiltuse:disabled{opacity:.45}
.tiltstop{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.slot{display:flex;flex-direction:column;gap:5px}
.slotname{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.boxes{display:flex;gap:7px}
.box{flex:1;min-width:0;background:var(--surface-2);border:2px solid transparent;border-radius:9px;padding:7px 9px;text-align:left;color:inherit}
.box.on{border-color:var(--accent)}
.box b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.box span{font-family:var(--num);font-size:19px;font-weight:600;display:block;min-height:25px;overflow:hidden}
.slotout{font-family:var(--num);font-size:16px;font-weight:600;color:var(--accent);padding-left:2px}
#distonote{font-size:13px;font-weight:600;padding:7px 10px;border-radius:9px;background:var(--surface-2);color:var(--accent)}
#distonote.bad{color:#c0392b}
.slotalt{font-family:var(--num);font-size:12.5px;font-weight:500;color:var(--ink-2)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#pad button{background:var(--surface-2);color:var(--ink);border:none;border-radius:9px;padding:14px 2px;font-family:var(--num);font-size:19px;font-weight:600}
#pad button.aux{font-family:var(--display);font-size:17px;letter-spacing:.05em}
#fracs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#fracs button{background:var(--surface-2);color:var(--ink-2);border:none;border-radius:9px;padding:10px 2px;font-family:var(--num);font-size:14px;font-weight:600}
#sheetacts{display:flex;gap:8px}
#sheetacts button{flex:1;border:none;border-radius:9px;padding:13px;font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#cancel{background:var(--surface-2);color:var(--ink-2)}
#removebtn{background:none;border:1px solid var(--miss);color:var(--miss);border-radius:9px;
  padding:11px;font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
#save{background:var(--accent);color:var(--accent-ink)}
button{font-size:16px;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){#sheetbox{animation:rise .16s ease-out}@keyframes rise{from{transform:translateY(18px)}}}
</style>

<div id="app">
  <header>
    <h1>Field Measure</h1>
    <span id="hdr"><span id="sync">local</span><button id="jobbtn">Job 1</button></span>
  </header>

  <div id="modebar">
    <button class="mode" data-mode="draw" aria-pressed="true">Draw</button>
    <button class="mode" data-mode="measure" aria-pressed="false">Measure</button>
    <button class="mode" data-mode="open" aria-pressed="false">Openings</button>
  </div>
  <div id="shapebar"></div>
  <div id="hint"><span id="hinttext"></span><button class="chip" id="snap">90&deg;</button></div>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="stagebtns">
      <button class="sbtn" id="fit">Fit</button>
      <button class="sbtn" id="lock" aria-label="Lock the drawing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 10.9V7.9a3.5 3.5 0 0 1 5.98-2.47"/><rect x="5.1" y="10.9" width="13.8" height="9.3" rx="1.7"/><circle cx="12" cy="15.5" r="1.15" fill="currentColor" stroke="none"/></svg></button>
      <button class="sbtn" id="undo">Undo</button>
      <button class="sbtn" id="redo" hidden>Redo</button>
      <button class="sbtn" id="distobtn" aria-pressed="false">Disto</button>
    </div>
    <!-- Catches what a Bluetooth laser "types". iPhone only hands keyboard
         input to a page that has a typing box in focus; inputmode=none keeps
         the on-screen keyboard from popping up. -->
    <input id="distoin" type="text" inputmode="none" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1"
      style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none">

    <div id="tools" hidden>
      <button class="chip" id="close" hidden>Close shape</button>
      <button class="chip" id="jog">Jog</button>
      <button class="chip" id="cut">45&deg; cut</button>
      <button class="chip" id="erase">Erase wall</button>
      <!-- Align sits last because it is the one that comes and goes as the
           drawing grows. Anywhere earlier and its arrival shoves every other
           button sideways while you are reaching for one. -->
      <button class="chip" id="align">Align</button>
    </div>

  <div id="panel">
    <div id="grip"></div>
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="walls" aria-selected="true">Walls</button>
      <button class="tab" role="tab" data-tab="openings" aria-selected="false">Openings</button>
      <button class="tab" role="tab" data-tab="heights" aria-selected="false">Heights</button>
      <button class="tab" role="tab" data-tab="summary" aria-selected="false">Summary</button>
    </div>
    <div id="view"></div>
  </div>
  </div>

  <div id="statusrow">
    <button id="status"><span id="statustext"></span><span id="caret"></span></button>
    <button id="backbtn" hidden>Back</button>
    <button id="revbtn" hidden aria-label="Go the other way round">&#8630;</button>
    <button id="findbtn" hidden>Find it</button>
  </div>

  <div id="modal" hidden><div id="modalbox"></div></div>

  <div id="fullshot" hidden></div>
  <div id="review" hidden><div id="revbox"></div><button id="revclose">Done</button></div>

  <div id="sheet" hidden>
    <div id="sheetbox">
      <div id="sheettitle"></div>
      <div id="spanview" hidden></div>
      <div id="tiltbox" hidden></div>
      <div id="kinds"></div>
      <div id="flagrow" hidden></div>
      <div id="fields"></div>
      <div id="distonote" hidden></div>
      <div id="fracs"></div>
      <div id="pad"></div>
      <div id="sheetacts">
        <button id="cancel">Cancel</button>
        <button id="save">Save</button>
      </div>
      <button id="removebtn" hidden>Remove this opening</button>
    </div>
  </div>
</div>

   of jobs, shared with Receipt Run). bookPending: made with no signal, to be
   added to Job Book as soon as there is one. */
function blankJob(name,bookJobId,bookPending){
  return{id:'j'+Date.now()+Math.floor(Math.random()*9999),name:name,updated:Date.now(),
    bookJobId:bookJobId||null,bookPending:!!bookPending,
    shapes:[blankShape('House')],active:0,heights:{},snap:90,view:{ox:0,oy:0,s:1}};
}
function readDB(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var d=JSON.parse(r);
      if(d&&d.jobs&&d.jobs.length){DB=d;if(!(DB.active>=0&&DB.active<DB.jobs.length))DB.active=0;return;}}
    var o=localStorage.getItem(OLD);
    if(o){var od=JSON.parse(o);
      if(od&&od.pts){var j=blankJob('Job 1');
        j.pts=od.pts||[];j.closed=!!od.closed;j.walls=od.walls||[];j.openings=od.openings||[];
        j.heights=od.heights||{};if(od.snap!==undefined)j.snap=od.snap;if(od.view)j.view=od.view;
        DB={jobs:[j],active:0};return;}}
  }catch(e){}
  DB={jobs:[blankJob('Job 1')],active:0};
}
/* ---------- interior: floors of rooms ----------
   A job's interior is job.interior = {floors:[...], active}. Each floor is
   shaped like a job (shapes = its rooms, active, view, snap, heights...) so
   every tool that works on "the current job's outlines" works on a floor's
   rooms unchanged. The floor borrows the job's name, units and Job Book link
   through its prototype; those are never stored on the floor. */
function curJob(){return DB.jobs[DB.active];}
function blankFloor(name){
  /* inch:true - drawn at a fixed scale, one drawing unit to the inch, so the
     wall between rooms is exactly its thickness from the very first room */
  return{floor:name,shapes:[blankShape('Room 1')],active:0,heights:{},ridges:[],heightsOff:{},
    snap:90,view:{ox:0,oy:0,s:1},locked:false,wallT:'4 1/2"',inch:true};
}
function ensureFloor(f){
  if(!f.shapes||!f.shapes.length)f.shapes=[blankShape('Room 1')];
  if(!(f.active>=0&&f.active<f.shapes.length))f.active=0;
  if(!f.heights)f.heights={};if(!f.ridges)f.ridges=[];if(!f.heightsOff)f.heightsOff={};
  if(f.snap===undefined)f.snap=90;if(!f.view)f.view={ox:0,oy:0,s:1};
  if(f.locked===undefined)f.locked=false;if(!f.wallT)f.wallT='4 1/2"';
  if(!f.floor)f.floor='1st floor';
}
function curFloor(j){
  j=j||curJob();if(!j)return null;
  if(!j.interior||!j.interior.floors||!j.interior.floors.length)
    j.interior={floors:[blankFloor('1st floor')],active:0};
  var I=j.interior;
  if(!(I.active>=0&&I.active<I.floors.length))I.active=0;
  var f=I.floors[I.active];
  ensureFloor(f);
  if(Object.getPrototypeOf(f)!==j)Object.setPrototypeOf(f,j);
  return f;
}
function cur(){var j=curJob();if(!j)return j;return j.side==='int'?curFloor(j):j;}
function curShape(){
  var j=cur();if(!j)return null;
  if(!j.shapes||!j.shapes.length){
    /* an older job kept one outline at the top level - lift it into the list */
    var sh=blankShape('House');
    sh.pts=j.pts||[];sh.closed=!!j.closed;sh.walls=j.walls||[];sh.openings=j.openings||[];
    j.shapes=[sh];j.active=0;
    delete j.pts;delete j.closed;delete j.walls;delete j.openings;
  }
  if(!(j.active>=0&&j.active<j.shapes.length))j.active=0;
  return j.shapes[j.active];
}
function intoState(){
  var j=cur(),sh=curShape();if(!sh)return;
  S.pts=sh.pts||(sh.pts=[]);S.closed=!!sh.closed;
  S.walls=sh.walls||(sh.walls=[]);S.openings=sh.openings||(sh.openings=[]);
  S.heights=j.heights||(j.heights={});S.snap=(j.snap===undefined?90:j.snap);
  S.locked=!!j.locked;
  V=j.view||{ox:0,oy:0,s:1};
  /* each outline/room keeps its own undo history while the app is open, so
     going back to a room you drew earlier still lets you step it back */
  if(histShape)HISTS.set(histShape,{h:hist,f:future});
  var hs=HISTS.get(sh);
  hist=hs?hs.h:[];future=hs?hs.f:[];histShape=sh;
  lastWall=-1;measHist=[];alignGroups=[];
}
var HISTS=new WeakMap(),histShape=null;
/* Re-point the live state at the current outline's arrays WITHOUT throwing
   away the undo history. The housekeeping pass in render() welds corners
   that have landed on top of each other, and it used to call intoState for
   this — which cleared the history, so whatever caused the weld could no
   longer be undone and a damaged drawing was permanent. Switching jobs or
   outlines still uses intoState: there, starting clean is correct. */
function resyncShape(){
  var sh=curShape();if(!sh)return;
  S.pts=sh.pts||(sh.pts=[]);S.closed=!!sh.closed;
  S.walls=sh.walls||(sh.walls=[]);S.openings=sh.openings||(sh.openings=[]);
}
/* What was last saved. save() runs on every redraw; it only stamps the jobs
   as changed (and sends them) when something actually changed. Stamping on
   every redraw made a phone that had just opened look newer than a change
   made elsewhere, so it ignored that change and then wrote over it. */
var lastSaved='';
function save(){
  var j=cur(),sh=curShape();if(!j||!sh)return;
  sh.pts=S.pts;sh.closed=S.closed;sh.walls=S.walls;sh.openings=S.openings;
  j.heights=S.heights;j.snap=S.snap;j.view=V;j.locked=!!S.locked;
  var body;try{body=JSON.stringify(DB);}catch(e){body=null;}
  if(body!==null&&body===lastSaved)return;            /* nothing new */
  j.updated=Date.now();
  if(curJob()!==j)curJob().updated=j.updated;   /* a floor: the job changed too */
  DB.updated=Date.now();
  try{lastSaved=JSON.stringify(DB);localStorage.setItem(KEY,lastSaved);}catch(e){}
  schedulePush();
}
function shapeSegs(sh){return (!sh.pts||sh.pts.length<2)?0:(sh.closed?sh.pts.length:sh.pts.length-1);}
function withShape(sh,fn){
  var a=S.pts,b=S.closed,c=S.walls,d=S.openings;
  S.pts=sh.pts||[];S.closed=!!sh.closed;S.walls=sh.walls||[];S.openings=sh.openings||[];
  var r=fn();
  S.pts=a;S.closed=b;S.walls=c;S.openings=d;
  return r;
}
readDB();
migrateAll(DB);   /* rename old height keys before anything reads them */
/* The last few dozen things done, sent along with a Feedback note so a
   report like "it went through the room" comes with the taps behind it.
   Kept in memory only; nothing is stored or sent unless Feedback is used. */
window.FMLog=(function(){
  var buf=[];
  function r(p){return p?[Math.round(p.x*4)/4,Math.round(p.y*4)/4]:null;}
  return{
    add:function(t,o){
      try{buf.push(new Date().toTimeString().slice(0,8)+' '+t+(o?' '+JSON.stringify(o):''));}catch(e){}
      if(buf.length>60)buf.shift();
    },
    text:function(){
      var head='';
      try{
        var j=cur();
        head='state '+JSON.stringify({side:isInt()?'interior':'exterior',floor:isInt()?j.floor:null,
          room:curShape().name,mode:S.mode,snap:S.snap,zoom:Math.round(V.s*100)/100,closed:S.closed,
          wallT:isInt()?j.wallT:null,pts:S.pts.map(r),
          lens:S.walls.map(function(w){return(w&&w.len)||'';}),
          others:(j.shapes||[]).filter(function(sh,i){return i!==j.active;}).map(function(sh){return{name:sh.name,closed:!!sh.closed,
            pts:(sh.pts||[]).map(r),lens:(sh.walls||[]).map(function(w){return(w&&w.len)||'';})};})})+'\n';
      }catch(e){}

         oldest taps go first and the rooms always come through */

})();

/* Where measurements live is storage.js's business, not this file's.
   localStorage keeps the app instant and usable with no signal; the database
   behind storage.js is the copy that survives a dead battery or a new phone. */
function logOut(o){ try{ console.log('[FM]',o); }catch(e){} }
function setSync(mode){
  var e=document.getElementById('sync');if(!e)return;
  var txt={connecting:'syncing',saving:'saving',ok:'saved',local:'phone only',err:'not saved'}[mode]||'';
  e.textContent=txt;
  e.className=(mode==='ok')?'ok':((mode==='local'||mode==='err')?'warn':'');
}
function schedulePush(){
  if(window.FMStore) FMStore.push(DB);
}
function initCloud(){
  if(!window.FMStore){setSync('local');return;}
  FMStore.init({
    onStatus:setSync,
    onReady:linkJobs,
    onRemote:function(rem){
      /* The server has a copy. Take it only if it is newer than what is on this
         phone, or if this phone has nothing drawn yet. */
      var mine=DB.updated||0, theirs=rem.updated||0;
      var mineHasWork=(DB.jobs||[]).some(function(j){
        return (j.shapes||[]).some(function(sh){return sh.pts&&sh.pts.length;})||(j.pts&&j.pts.length);
      });
      if(theirs>mine||!mineHasWork){
        DB=rem;migrateAll(DB);
        try{lastSaved=JSON.stringify(DB);localStorage.setItem(KEY,lastSaved);}catch(e){}
        intoState();setMode(S.closed?'measure':'draw');fitView();render();
      }
    }
  });

/* Keep every job tied to Job Book:
   - a linked job takes its name from Job Book (renamed there, renamed here)
   - a job made with no signal is added to Job Book now
   - an unlinked job whose name exactly matches a Job Book job is linked to it
   Jobs that match nothing (tests, scratch drawings) are left alone. */
var linking=false;
function jbNorm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function linkJobs(){
  if(linking||!window.FMStore||!FMStore.signedIn()||!FMStore.jobBook)return;
  linking=true;
  FMStore.jobBook().then(function(list){
    var changed=false,chain=Promise.resolve();
    var byId={},byName={};
    list.forEach(function(b){byId[b.id]=b;if(!b.archived)byName[jbNorm(b.name)]=b;});
    DB.jobs.forEach(function(j){
      if(j.bookJobId){
        var b=byId[j.bookJobId];
        if(b&&b.name&&b.name!==j.name){j.name=b.name;changed=true;}
        return;
      }
      var hit=byName[jbNorm(j.name)];
      if(hit){j.bookJobId=hit.id;j.bookPending=false;changed=true;return;}
      if(j.bookPending){
        chain=chain.then(function(){
          return FMStore.addToJobBook(j.name).then(function(id){
            if(id){j.bookJobId=id;j.bookPending=false;changed=true;}
          });
        });
      }
    });
    return chain.then(function(){
      if(changed){
        DB.updated=Date.now();
        try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
        schedulePush();render();
        if(!modal.hidden&&mbox.querySelector('.jrow'))openJobs();
      }
    });
  }).catch(function(){}).then(function(){linking=false;});
}
addEventListener('online',function(){setTimeout(linkJobs,1500);});
function jobLinkNote(j){
  if(j.bookJobId)return 'in Job Book';
  if(j.bookPending)return 'goes to Job Book when online';
  return 'Field Measure only';
}

function stateStr(others){
  var o={pts:S.pts,closed:S.closed,walls:S.walls,openings:S.openings};
  /* a fit also moves the rooms next door; that step carries their corners
     too, so one Undo puts the whole floor back */
  if(others)o.others=others.map(function(si){return{si:si,pts:cur().shapes[si].pts};});
  return JSON.stringify(o);
}
function applyState(str){
  var d=JSON.parse(str);
  S.pts=d.pts;S.closed=d.closed;S.walls=d.walls;S.openings=d.openings;
  if(d.others){
    var sh=cur().shapes;
    d.others.forEach(function(o){
      var t=sh[o.si];if(!t||!t.pts||t.pts.length!==o.pts.length)return;
      o.pts.forEach(function(q,k){t.pts[k].x=q.x;t.pts[k].y=q.y;});
    });
  }
}
function othersIn(str){try{var d=JSON.parse(str);return d.others?d.others.map(function(o){return o.si;}):null;}catch(e){return null;}}
function snapshot(){
  hist.push(stateStr());
  if(hist.length>60)hist.shift();
  future=[];            /* a fresh change means there's nothing to redo */
}
function undo(){
  if(!hist.length)return false;
  var top=hist[hist.length-1];
  future.push(stateStr(othersIn(top)));
  if(future.length>60)future.shift();
  applyState(hist.pop());
  return true;
}
function redo(){
  if(!future.length)return false;
  var top=future[future.length-1];
  hist.push(stateStr(othersIn(top)));
  applyState(future.pop());
  return true;
}
function filledNow(){
  var c=0;
  (S.walls||[]).forEach(function(w){if(w&&w.len)c++;});
  return c;
}
function filledIn(str){
  try{
    var d=JSON.parse(str),c=0;
    (d.walls||[]).forEach(function(w){if(w&&w.len)c++;});
    return c;

function segCount(){return S.pts.length<2?0:(S.closed?S.pts.length:S.pts.length-1);}
function seg(i){return[S.pts[i],S.pts[(i+1)%S.pts.length]];}
function wallLen(i){return(S.walls[i]&&S.walls[i].len)||'';}
function setWallLen(i,v){if(!S.walls[i])S.walls[i]={};S.walls[i].len=v;}
function endGap(i){return(S.walls[i]&&S.walls[i].endGap)||'';}
function setEndGap(i,v){if(!S.walls[i])S.walls[i]={};S.walls[i].endGap=v;}

/* ---------- where a detached outline sits ----------
   A pool or a shed is drawn as its own outline, away from the house. Where it
   sits is not in the drawing — the drawing is rough. It lives as two numbers
   taken off one house wall: straight out from that wall, and along that wall
   from its top-left corner (the same anchor the opening spacing uses, so the
   two never disagree). Those two numbers plus the outline's own dimensions
   are everything SketchUp needs to put it in the right place. */
function tieOf(sh){return (sh&&sh.tie)||null;}
function tieDone(sh){var t=tieOf(sh);return !!(t&&t.out&&t.along);}
function tieRefIdx(t){return (t&&t.shape!=null)?t.shape:0;}
function tieRefName(j,t){
  var r=j&&j.shapes&&j.shapes[tieRefIdx(t)];
  return (r&&r.name)||'House';
}
/* A wall of some other outline, named the way it reads in a list. */
function shapeWallLabel(sh,w){
  return withShape(sh,function(){

}
/* A tie belongs on anything that is not the first outline. The first outline
   is the house: it is what everything else is measured from. */
/* Rooms place themselves against each other as they're drawn, so only an
   exterior outline needs tying to the house. */
function needsTie(j,si){return si>0&&!isInt();}
function tieText(j,sh){

/* ---------- where openings sit along a wall ----------
   Measurements run from one end of the wall, and that end has to be the same
   every time or the numbers mean nothing. The drawing never rotates, so the
   top-left-most of the wall's two corners is a fixed, readable anchor. */
function wallStartCorner(w){
  var sg=seg(w),a=sg[0],b=sg[1];
  if(Math.abs(a.y-b.y)>0.5)return a.y<b.y?0:1;
  return a.x<=b.x?0:1;
}
function distFromStart(w,o){return wallStartCorner(w)===0?o.t:1-o.t;}
/* The openings on a wall, in the order you walk past them from that corner. */
function wallOpenings(w){
  var ix=[];
  S.openings.forEach(function(o,i){if(o.wall===w)ix.push(i);});
  ix.sort(function(p,q){return distFromStart(w,S.openings[p])-distFromStart(w,S.openings[q]);});
  return ix;
}
/* The run of gaps down a wall: corner to the first opening, opening to
   opening, last opening to the far corner. One more gap than openings. */
function gapChain(w){
  var ix=wallOpenings(w),rows=[];
  if(!ix.length)return rows;
  ix.forEach(function(i,k){
    rows.push({slot:k,open:i,
      from:k===0?'Corner':kindLabel(kindOf(S.openings[ix[k-1]])),
      to:kindLabel(kindOf(S.openings[i])),
      value:S.openings[i].gap||''});
  });
  rows.push({slot:ix.length,open:-1,
    from:kindLabel(kindOf(S.openings[ix[ix.length-1]])),to:'Corner',value:endGap(w)});
  return rows;
}
/* Gap by gap is the easy number to read off a tape, and its one weakness is
   that an error in the middle hides in the total. The app does the sum the
   tape can't: gaps plus opening widths have to come to the wall length. */
/* a wall carrying a guess is not a wall with a mistake on it */
function wallApprox(w){
  if(S.walls[w]&&S.walls[w].approx)return true;
  return wallOpenings(w).some(function(i){return !!S.openings[i].approx;});
}
function setWallApprox(w,v){
  if(!S.walls[w])S.walls[w]={};
  if(v)S.walls[w].approx=true;else delete S.walls[w].approx;
}
function gapCheck(w){
  var ix=wallOpenings(w);
  if(!ix.length)return null;
  var L=dim16(wallLen(w));
  if(!L)return{need:'length'};
  var sum=0,missing=0;
  ix.forEach(function(i){
    var o=S.openings[i];
    if(!o.gap)missing++;
    if(!o.w)missing++;
    sum+=dim16(o.gap)+dim16(o.w);
  });
  if(!endGap(w))missing++;
  sum+=dim16(endGap(w));
  if(missing)return{need:'more',missing:missing};
  return{diff:sum-L,len:L,sum:sum};
}
/* Once a wall's run is complete, the openings move to where the tape says
   they are. Until then they stay where they were dropped. */
function applyGaps(w){
  var c=gapCheck(w);
  if(!c||c.need)return false;
  var L=c.len,st=wallStartCorner(w),ix=wallOpenings(w),run=0;
  ix.forEach(function(i){
    var o=S.openings[i];
    run+=dim16(o.gap);
    var mid=run+dim16(o.w)/2;
    run+=dim16(o.w);
    var t=Math.max(0,Math.min(1,mid/L));
    o.t=(st===0)?t:1-t;
  });
  return true;
}
/* ---------- canvas ---------- */
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0;
function cssvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
var cvTop=null;
function fit(){
  var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(!r.width||!r.height)return;
  /* if the box moved down or up on the page (something above it changed
     height), shift the view the other way so the drawing stays put */
  if(cvTop!==null&&Math.abs(r.top-cvTop)>=1)V.oy+=cvTop-r.top;
  cvTop=r.top;
  if(Math.abs(r.width-W)<1&&Math.abs(r.height-H)<1){paint();return;}
  W=r.width;H=r.height;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);paint();
}
window.addEventListener('resize',fit);
/* fit() used to run only on a window resize. On iOS the first run happens
   before the layout has settled — fonts still loading, safe-area insets not
   yet resolved — so it locked in a canvas bitmap taller than the box it ends
   up in (623 vs 602 on a 390x844 phone). The browser then squashes the
   picture to fit, so every wall is DRAWN higher than where the hit test
   thinks it is, by an amount that grows the further down the canvas you go:
   ~2px near the top, ~20px at the bottom against a 28px tap tolerance. That
   is why a jog or a drag on a low wall missed while the same tap up top was
   fine, and why widening the grab radius never fixed it — the error scales
   with depth, a wider radius is a constant. Nothing fired a resize, so the
   bad measurement survived the whole session; rotating the phone cured it.
   Watching the element itself catches the startup settle AND every in-page
   layout change (the hint banner growing to two lines, the footer list
   opening). Setting cv.width/height does not change the element's CSS box,
   so this cannot feed back on itself. */
if(window.ResizeObserver){
  try{ new ResizeObserver(fit).observe(cv); }catch(e){}
}else{
  /* no ResizeObserver: re-measure a few times while the layout settles */
  [60,250,600,1200].forEach(function(ms){setTimeout(fit,ms);});
}
if(window.matchMedia)try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint);}catch(e){}

function ptOn(i,t){var s=seg(i);return{x:s[0].x+t*(s[1].x-s[0].x),y:s[0].y+t*(s[1].y-s[0].y)};}

function snapPoint(p){

     coordinate moves, so the wall stays square. */

/* ---------- rooms that snap together ----------

/* Sixteenths of an inch per drawing unit, from every measured wall in every

   its own (or a guess when it had no lengths yet), the dotted lines of two
   rooms side by side came out different distances from their walls and
   didn't meet. */

        if(dd>1)rs.push(L/dd);

/* The wall's thickness as it is DRAWN on this floor: the gap between two

/* ---------- Leica Disto (or any Bluetooth keyboard) ----------
   The Disto X3 pairs with the phone as a keyboard: press its send key and it
   "types" the reading, e.g. 12'04 1/2"  or  3.772 m  or  148.5 in, followed by
   Enter or Tab. While the entry sheet is open, collect those keystrokes, turn
   the reading into feet / inches / sixteenths, drop it into the box that is
   selected, and move on to the next measurement. The on-screen pad is
   untouched; this only listens. */
var DISTO={buf:'',timer:null,noteTimer:null};
function distoReset(){
  DISTO.buf='';
  if(DISTO.timer){clearTimeout(DISTO.timer);DISTO.timer=null;}
  if(DISTO.noteTimer){clearTimeout(DISTO.noteTimer);DISTO.noteTimer=null;}
  var n=document.getElementById('distonote');if(n){n.hidden=true;n.textContent='';}
}
function distoNote(msg,bad){
  var n=document.getElementById('distonote');
  n.textContent=msg;n.className=bad?'bad':'';n.hidden=false;
  if(DISTO.noteTimer)clearTimeout(DISTO.noteTimer);
  DISTO.noteTimer=setTimeout(function(){n.hidden=true;},bad?6000:3000);
}
/* A reading as sixteenths of an inch, or null if it can't be read safely. */
function distoTo16(raw){
  var s=(raw||'').trim().replace(/[′’‘]/g,"'").replace(/[″”“]/g,'"')
    .replace(/''/g,'"').replace(/\s+/g,' ');
  if(!s)return null;
  var m,v;
  /* feet + inches (+ fraction):  12'04 1/2"   12' 4-1/2"   12'4" */
  m=s.match(/^(\d+)\s*'\s*(?:(\d+)(?:[ -]+(\d+)\/(\d+))?|(\d+)\/(\d+))?\s*"?$/);
  if(m){
    v=parseInt(m[1],10)*12+(m[2]?parseInt(m[2],10):0);
    if(m[3])v+=parseInt(m[3],10)/parseInt(m[4],10);
    if(m[5])v+=parseInt(m[5],10)/parseInt(m[6],10);
    return Math.round(v*16);
  }
  /* inches with a fraction:  148 1/2"   148 1/2 in   5/8 in */
  m=s.match(/^(?:(\d+)[ -]+)?(\d+)\/(\d+)\s*(?:"|in)$/i);
  if(m)return Math.round(((m[1]?parseInt(m[1],10):0)+parseInt(m[2],10)/parseInt(m[3],10))*16);
  /* a decimal number with a unit:  3.772 m   3772 mm   12.38 ft   148.5 in   148.5" */
  m=s.match(/^(\d+(?:[.,]\d+)?)\s*(mm|cm|m|ft|'|in|")$/i);
  if(m){
    v=parseFloat(m[1].replace(',','.'));
    var u=m[2].toLowerCase(),inch;
    if(u==='mm')inch=v/25.4;
    else if(u==='cm')inch=v/2.54;
    else if(u==='m')inch=v/0.0254;
    else if(u==='ft'||u==="'")inch=v*12;
    else inch=v;
    return Math.round(inch*16);
  }
  return null;
}
/* No entry box open, but a wall is selected in Measure: the reading goes

function distoDirectOK(){
  if(SH||S.mode!=='measure'||!(lastWall>=0&&lastWall<segCount()))return false;

/* a Disto reading saved as the whole run the selected wall sits on */
function distoRun(i,sp,t){

  if(autoFitOn()){

    if(af.res&&af.res.msg)flag=' '+af.res.msg;
  }else{
    recordMeas(function(){setRun(sp,prevRun);checkAutoUnlock();},i);

  }

function distoDirect(raw){
  var i=lastWall,t=distoTo16(raw);
  if(t===null){
    say(/^\s*\d+([.,]\d+)?\s*$/.test(raw)
      ? 'Got '+raw.trim()+' with no unit. On the Disto, turn on sending the unit (Bluetooth settings), then send again.'
      : 'Couldn’t read "'+raw.trim()+'". Nothing was filled in.');
    render();return;
  }
  if(t<=0){say('Got a zero reading. Nothing was filled in.');render();return;}
  if(roomLockedNow()){say(curShape().name+' is locked (it’s finished). Hold its name and choose Unlock to change it.');render();return;}
  /* The selected wall sits on a straight run that hasn't been shot yet:
     the first shot on it is always the whole run, corner to corner past
     the jog. Every shot after that is just the selected wall. */
  var spD=isInt()?runSpan(i):null;
  if(spD&&!runOf(spD)){distoRun(i,spD,t);return;}
  distoDirectWall(i,t);
}
/* a Disto reading saved as the selected wall's own length */
function distoDirectWall(i,t){
  var prevVal=wallLen(i),txt=(units()==='in'?fmtInches(t):fmtFtIn(t));
  var flag='';
  if(autoFitOn()){
    /* the room takes the length straight away; Back or Undo puts it all back */
    var af=saveLenAuto(i,txt);
    recordMeas(function(){applyState(af.snap);if(hist[hist.length-1]===af.snap)hist.pop();checkAutoUnlock();},i);
    if(af.res&&af.res.msg)flag=' '+af.res.msg;
  }else{
    recordMeas(function(){setWallLen(i,prevVal);checkAutoUnlock();},i);
    setWallLen(i,txt);applyGaps(i);
  }
  flag+=jogCheck(i)+checkAutoLock();
  if(selectNextWall(i))say('✓ Wall '+(i+1)+': '+fmtFtIn(t)+'. Now on wall '+(lastWall+1)+'.'+flag);
  else say('✓ Wall '+(i+1)+': '+fmtFtIn(t)+'. Every wall has a length.'+flag);
  render();
}
function distoCommit(){
  if(DISTO.timer){clearTimeout(DISTO.timer);DISTO.timer=null;}
  var raw=DISTO.buf;DISTO.buf='';
  var ci=document.getElementById('distoin');if(ci)ci.value='';
  if(!raw.trim())return;
  if(!SH){if(distoDirectOK())distoDirect(raw);return;}
  var f=SH.fields[SH.active];
  if(f.type==='pitch'){distoNote('Got '+raw.trim()+' — pick a length box first, then send again.',true);return;}
  var t=distoTo16(raw);
  if(t===null){
    if(/^\s*\d+([.,]\d+)?\s*$/.test(raw))
      distoNote('Got '+raw.trim()+' with no unit. On the Disto, turn on sending the unit (Bluetooth settings), then send again.',true);
    else distoNote('Couldn’t read "'+raw.trim()+'". Nothing was filled in.',true);
    return;
  }
  if(t<=0){distoNote('Got a zero reading. Nothing was filled in.',true);return;}
  var ti=Math.floor(t/16),r=t%16;
  f.ft=String(Math.floor(ti/12));f.inch=String(ti%12);f.frac=r?reduce16(r):'';
  var label=f.label;
  /* on to the next length box, if there is one */
  for(var j=SH.active+1;j<SH.fields.length;j++){
    if(SH.fields[j].type!=='pitch'){SH.active=j;SH.part='ft';break;}
  }
  drawFields();
  distoNote('✓ '+label+': '+fmtFtIn(t)+'  (from the Disto)');
}

/* ---------- whole runs ----------
   A straight wall broken by a dormer or a jog is several walls in the
   drawing (1, the jog's 2-3-4, then 5 carrying on the same line). One long
   shot straight across, end to end, is more accurate than measuring each
   piece. runSpan(i) finds the straight line wall i sits on: the first and
   last walls along it, with a jog between. The measurement lives on the
   first wall of the run: walls[from].run = {to, len}. */
function wallDir(i){var s=seg(i),dx=s[1].x-s[0].x,dy=s[1].y-s[0].y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l,A:s[0]};}
function sameLine(i,k){
  var a=wallDir(i),b=wallDir(k);
  if(a.x*b.x+a.y*b.y<0.999)return false;
  /* inside (drawn to the inch) a dormer a little out of square leaves the
     far wall a fraction off the line: still the same run */
  var tol=(isInt()&&cur().inch)?2:0.5;
  return Math.abs((b.A.x-a.A.x)*(-a.y)+(b.A.y-a.A.y)*a.x)<tol;
}
function runSpan(i){
  var n=segCount();if(!S.closed||n<5)return null;
  var d=wallDir(i),from=i,to=i;
  for(var st=1;st<n;st++){var k=(i+st)%n,dk=wallDir(k);if(d.x*dk.x+d.y*dk.y<-0.5)break;if(sameLine(i,k))to=k;}
  for(st=1;st<n;st++){var k2=(i-st+n)%n,dk2=wallDir(k2);if(d.x*dk2.x+d.y*dk2.y<-0.5)break;if(sameLine(i,k2))from=k2;}
  if(from===to)return null;
  var A=seg(from)[0],B=seg(to)[1];
  return{from:from,to:to,drawn:Math.abs((B.x-A.x)*d.x+(B.y-A.y)*d.y)};
}
function shoelace(P){var a=0;for(var i=0;i<P.length;i++){var p=P[i],q=P[(i+1)%P.length];a+=p.x*q.y-q.x*p.y;}return a/2;}
/* Each wall's direction, squared to the nearest 45 (as auto-fit uses them). */
function roomDirs(){
  var n=segCount(),out=[];
  for(var i=0;i<n;i++){
    var s=seg(i),a=Math.round(Math.atan2(s[1].y-s[0].y,s[1].x-s[0].x)/(Math.PI/4))*(Math.PI/4);
    out.push({x:Math.round(Math.cos(a)*1e9)/1e9,y:Math.round(Math.sin(a)*1e9)/1e9});
  }
  return out;
}
/* The extra totals a room's measured whole runs add: the pieces along the
   line add up to the run; and where the jog is a simple three-wall bump
   (side, face, side) its two sides are the same depth. */
function runRowsFor(dirs,noStraight){
  var n=dirs.length,rows=[];
  for(var i=0;i<n;i++){
    var sp=runSpan(i);if(!sp||sp.from!==i)continue;
    var ud=dirs[i],pp={x:-ud.y,y:ud.x};
    /* a straight wall broken by a jog stays straight: the walls between
       come back to the same line (so a dormer's two sides stay equal) */
    /* only for a real bump-out (a dormer, a nook): the walls between enclose
       a small part of the room. A line across the room's middle (dormer to
       dormer) is still a fair thing to measure, but not a reason to force
       the two ends level with each other. */
    var jp=[];for(var mj=(i+1)%n;;mj=(mj+1)%n){jp.push(S.pts[mj]);if(mj===sp.to)break;}
    var jogA=Math.abs(shoelace(jp)),roomA=Math.abs(shoelace(S.pts));
    if(!noStraight&&jogA<0.2*roomA){
      var cs=new Array(n).fill(0),allSides=true;
      for(var m0=i;;m0=(m0+1)%n){
        cs[m0]=dirs[m0].x*pp.x+dirs[m0].y*pp.y;
        if(Math.abs(cs[m0])>0.01&&!dim16(wallLen(m0)))allSides=false;
        if(m0===sp.to)break;
      }
      /* Until both sides are shot, the drawing assumes the jog is square.
         Once they are, the tape decides: a dormer out of square stays so. */
      if(!allSides)rows.push({coef:cs,target:0,straight:true});
    }
    var wr=S.walls[i]&&S.walls[i].run;if(!wr||!wr.len||wr.to!==sp.to)continue;
    var R16=dim16(wr.len);if(!R16)continue;
    var coef=new Array(n).fill(0);
    for(var m=i;;m=(m+1)%n){coef[m]=dirs[m].x*ud.x+dirs[m].y*ud.y;if(m===wr.to)break;}
    rows.push({coef:coef,target:R16/16,run:true});
  }
  return rows;
}
/* Walls with no length yet that the measurements already pin down: the room
   has to close, and every measured whole run has to add up. Each comes
   back with the length it has to be (inches). */
function workedOut(){
  var n=segCount(),out={};
  if(!isInt()||!S.closed||n<3)return out;
  var dirs=roomDirs(),U=[],known={};
  for(var i=0;i<n;i++){var m=dim16(wallLen(i));if(m)known[i]=m/16;else U.push(i);}
  if(!U.length)return out;
  /* Only what the tape says counts here, never "the dormer is probably
     square": so the far side of a jog still gets shot, as the check. */
  var rows=[{coef:dirs.map(function(d){return d.x;}),target:0},{coef:dirs.map(function(d){return d.y;}),target:0}].concat(runRowsFor(dirs,true));
  /* nothing measured at all: nothing is worked out */
  if(!Object.keys(known).length&&!rows.some(function(r){return r.run;}))return out;
  var A=rows.map(function(r){
    var rhs=r.target;for(var k in known)rhs-=r.coef[k]*known[k];
    return U.map(function(u){return r.coef[u];}).concat([rhs]);
  });
  var R=A.length,C=U.length,piv=[],row=0;
  for(var c=0;c<C&&row<R;c++){
    var p=row;for(var r=row+1;r<R;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    if(Math.abs(A[p][c])<1e-9)continue;
    var t=A[row];A[row]=A[p];A[p]=t;
    var pv=A[row][c];for(var c2=0;c2<=C;c2++)A[row][c2]/=pv;
    for(r=0;r<R;r++){if(r===row)continue;var f=A[r][c];if(!f)continue;for(c2=0;c2<=C;c2++)A[r][c2]-=f*A[row][c2];}
    piv.push(c);row++;
  }
  var pivSet={};piv.forEach(function(c,k){pivSet[c]=k;});
  piv.forEach(function(c,k){
    for(var c3=0;c3<C;c3++)if(!(c3 in pivSet)&&Math.abs(A[k][c3])>1e-7)return;   /* leans on a free wall */
    var v=A[k][C];
    if(v>0.25)out[U[c]]=v;
  });

}
/* The next wall worth shooting from wall `from`: simply the next one round
   the room as you walk it, skipping any already measured or worked out.
   Shoot the run first, then walk: the one wall left on the run's line
   works itself out at the end. */
function nextBlankWall(from,dir){
  var n=segCount();if(!n)return -1;
  dir=dir||1;
  var wo=isInt()?workedOut():{};
  for(var st=1;st<=n;st++){
    var k=(((from+dir*st)%n)+n)%n;
    if(wallLen(k)||wo[k])continue;
    return k;
  }

/* Yellow walls: on the line of a run that's been shot, with no length of
   their own and not yet worked out. One more wall and they will be. */
function runCovered(wo){
  var n=segCount(),out={};if(!isInt()||!S.closed)return out;
  wo=wo||workedOut();
  for(var i=0;i<n;i++){
    var wr=S.walls[i]&&S.walls[i].run;if(!wr||!wr.len)continue;
    var sp=runSpan(i);if(!sp||sp.from!==i||sp.to!==wr.to)continue;
    for(var m=i;;m=(m+1)%n){
      if(sameLine(i,m)&&!wallLen(m)&&!wo[m])out[m]=1;
      if(m===sp.to)break;

/* Both sides of a jog shot: do they agree? A note when the dormer is more
   than 1/4" out of square, so it's a choice, not a surprise. */
function jogCheck(i){
  if(!isInt()||!S.closed)return '';
  var n=segCount(),dirs=roomDirs(),msg='';
  for(var f=0;f<n;f++){
    var sp=runSpan(f);if(!sp||sp.from!==f)continue;
    var inJog=false,ud=dirs[f],pp={x:-ud.y,y:ud.x},sum=0,all=true,sides=[];
    for(var m=(f+1)%n;m!==sp.to;m=(m+1)%n){
      if(m===i)inJog=true;
      var c=dirs[m].x*pp.x+dirs[m].y*pp.y;if(Math.abs(c)<0.01)continue;
      var L=dim16(wallLen(m));if(!L){all=false;break;}
      sum+=c*L/16;sides.push(m+1);
    }
    if(!inJog||!all||sides.length<2)continue;
    if(Math.abs(sum)>0.25)msg+=' Walls '+sides.join(' and ')+' differ by '+(function(d){return d<16?reduce16(d)+'"':fmtInches(d);})(Math.round(Math.abs(sum)*16))+
      ' — out of square. Both lengths are kept; reshoot one if that’s a misread.';
    else msg+=' Walls '+sides.join(' and ')+' agree — square.';

function runOf(sp){var w=S.walls[sp.from];return(w&&w.run&&w.run.to===sp.to)?w.run.len:'';}

/* A gap in a list is just a number; on the wall it is a place. This draws
   the wall end to end with its openings in order and marks the one span
   being typed, so there is no counting along the row to work out which. */
function spanSVG(w,row){
  var ix=wallOpenings(w),items=[];
  ix.forEach(function(oi,k){
    var o=S.openings[oi];
    items.push({t:'gap',slot:k,v:dim16(o.gap)});
    items.push({t:'op',oi:oi,v:dim16(o.w),g:kindGlyph(kindOf(o))});
  });
  items.push({t:'gap',slot:ix.length,v:dim16(endGap(w))});
  var L=dim16(wallLen(w)),known=0,unk=0;
  items.forEach(function(it){if(it.v>0)known+=it.v;else unk++;});
  /* anything not measured yet gets a nominal share, so the strip still
     reads as a wall instead of collapsing */
  var share=(L>known&&unk)?(L-known)/unk:(known?known/items.length:1);
  var tot=0;
  items.forEach(function(it){it.wgt=it.v>0?it.v:Math.max(share,1);tot+=it.wgt;});
  if(!tot)return '';
  var X0=4,X1=96,SP=X1-X0,run=X0,parts=[],hit=null;
  items.forEach(function(it){
    var wd=it.wgt/tot*SP,a=run,b=run+wd;run=b;
    if(it.t==='op'){
      parts.push('<rect x="'+a.toFixed(2)+'" y="4.4" width="'+Math.max(wd,1.6).toFixed(2)+
        '" height="5.2" rx="0.8" fill="var(--accent)"/>');
      if(wd>5)parts.push('<text x="'+((a+b)/2).toFixed(2)+'" y="8.6" text-anchor="middle" '+
        'font-size="4" font-family="Barlow Condensed,sans-serif" font-weight="700" '+
        'fill="var(--accent-ink)">'+it.g+'</text>');
    }else if(it.slot===row.slot)hit=[a,b];
  });
  var mark='';
  if(hit){
    var a=hit[0],b=hit[1],m=(a+b)/2;
    mark='<line x1="'+a.toFixed(2)+'" y1="13" x2="'+b.toFixed(2)+'" y2="13" stroke="var(--accent)" stroke-width="1.1"/>'+
      '<line x1="'+a.toFixed(2)+'" y1="10.4" x2="'+a.toFixed(2)+'" y2="15.6" stroke="var(--accent)" stroke-width="1.1"/>'+
      '<line x1="'+b.toFixed(2)+'" y1="10.4" x2="'+b.toFixed(2)+'" y2="15.6" stroke="var(--accent)" stroke-width="1.1"/>'+
      '<rect x="'+(a-0.4).toFixed(2)+'" y="3.6" width="'+(b-a+0.8).toFixed(2)+
      '" height="6.8" fill="var(--accent)" opacity="0.16"/>';
  }
  return '<svg viewBox="0 0 100 17" aria-hidden="true">'+
    '<line x1="'+X0+'" y1="7" x2="'+X1+'" y2="7" stroke="var(--ink-2)" stroke-width="0.7"/>'+
    '<line x1="'+X0+'" y1="2.6" x2="'+X0+'" y2="11.4" stroke="var(--ink)" stroke-width="1.1"/>'+
    '<line x1="'+X1+'" y1="2.6" x2="'+X1+'" y2="11.4" stroke="var(--ink)" stroke-width="1.1"/>'+
    parts.join('')+mark+'</svg>'+
    '<div class="cap">Wall '+(w+1)+', top-left corner on the left'+
    (L?'':'  \u2014  spacing shown rough until the wall has a length')+'</div>';
}

  var mad=med(g.map(function(x){return Math.abs(x.v-M);}));
  var lim=Math.max(192,mad*1.5);
  return g.filter(function(x){return Math.abs(x.v-M)>lim;})
          .map(function(x){return{i:x.i,v:x.v,med:M};});
}
/* Eave plus half the span at the pitch you noted should land near the ridge.
   Plenty of honest reasons it won't, so this only ever murmurs. */
function roofCheck(){
  var h=S.heights||{},eave=dim16(h['Eave height']),ridge=dim16(h['Main ridge']);
  var p=h['Roof pitch'];
  if(!eave||!ridge||!p)return null;
  var m=String(p).match(/(\d+(?:\.\d+)?)/);
  if(!m)return null;
  var sc=scaleFactor();
  if(!sc||!S.pts.length)return null;
  var xs=S.pts.map(function(q){return q.x;}),ys=S.pts.map(function(q){return q.y;});
  var bw=(Math.max.apply(null,xs)-Math.min.apply(null,xs))*sc;
  var bh=(Math.max.apply(null,ys)-Math.min.apply(null,ys))*sc;
  var span=Math.min(bw,bh);
  if(span<192)return null;
  var pred=eave+span/2*(parseFloat(m[1])/12);
  return{pred:pred,actual:ridge,diff:ridge-pred,span:span};
}
/* A tie that runs further along the wall than the wall is long is a number
   that cannot be true. It is the one check worth making on a location. */
function tieFlags(){
  var j=cur(),out=[];
  if(!j||!j.shapes)return out;
  j.shapes.forEach(function(sh,si){
    if(!needsTie(j,si))return;
    var t=tieOf(sh);
    if(!t||!t.out||!t.along)return;
    var ref=j.shapes[tieRefIdx(t)];
    if(!ref)return;
    var L=withShape(ref,function(){return dim16(wallLen(t.wall));});
    if(!L)return;
    var along=dim16(t.along);
    if(along>L+8)out.push({shape:si,name:sh.name,along:along,len:L,
      ref:(ref.name||'house'),wall:t.wall});
  });
  return out;
}
/* Everything the arithmetic doubts, in the order you would walk past it, so
   going back out is one lap of the house rather than a zig-zag. */
function reviewFlags(){
  var out=[],n=segCount();
  var c=closure();
  if(closureBad(c)){
    var sus=closureSuspects(c);
    sus.forEach(function(w){
      out.push({pos:w+0.5,kind:'wall',w:w,
        title:'Wall '+(w+1)+' — '+(showLen(wallLen(w))||'?'),
        why:'The shape is '+fmt16(Math.round(c.err))+' from closing, and this wall runs the way the error does. Re-pull it if you can.'});
    });
    if(!sus.length)out.push({pos:0,kind:'none',title:'The shape is '+fmt16(Math.round(c.err))+' from closing',
      why:'No single wall accounts for it — worth re-pulling the long ones.'});
  }
  gradeFlags().forEach(function(g){
    out.push({pos:g.i,kind:'grade',i:g.i,
      title:'Grade at corner '+(g.i+1)+' — '+showLen(S.pts[g.i].g),
      why:'Sits '+fmt16(Math.abs(g.v-g.med))+' off the other readings. Could be real ground, could be a typo.'});
  });
  tieFlags().forEach(function(t){
    out.push({pos:-1,kind:'tie',shape:t.shape,
      title:t.name+' sits past the end of that wall',
      why:'It is tied '+fmt16(t.along)+' along '+t.ref+' wall '+(t.wall+1)+
        ', but that wall is only '+fmt16(t.len)+' long. Check which corner you measured from.'});
  });
  for(var w=0;w<n;w++){
    if(wallApprox(w))continue;
    var gc=gapCheck(w);
    if(gc&&!gc.need&&Math.abs(gc.diff)>32){
      out.push({pos:w+0.6,kind:'gap',w:w,
        title:'Spacing on wall '+(w+1)+' — '+fmt16(Math.abs(gc.diff))+(gc.diff>0?' over':' under'),
        why:'Gaps and opening widths don’t come to the wall length. Tap Estimated if you placed these by eye.'});
    }
  }
  out.sort(function(a,b){return a.pos-b.pos;});
  return out;
}

  document.getElementById('review').hidden=false;
}

var SNAPLABEL={90:'90\u00b0',45:'45\u00b0',0:'Free'};
function hintText(){
  if(toolMsg)return toolMsg;
  if(S.locked&&S.mode==='draw')
    return 'Drawing locked \u2014 nothing can move. Measuring still works. Tap the padlock to edit again.';
  if(cutOn){
    if(!cutPicks.length)return 'Tap the corner a 45\u00b0 line starts from \u2014 or both ends of a wall to force that wall to 45\u00b0.';
    if(cutPicks.length===1)return 'Tap the wall the 45\u00b0 runs into, or the corner at the far end of this wall to straighten it to 45\u00b0.';
    return 'Tap the button to pin that wall to a true 45\u00b0.';
  }
  if(eraseOn)return 'Tap a wall to take it out. The two walls beside it run on until they meet.';
  if(jogOn)return 'Tap the wall where the jog belongs — it drops in '+(jogDir>0?'toward the house':'away from the house')+
    '. Tap the button again to flip it, or a third time to cancel.';
  if(alignOn)return alignSel.length<2
    ? 'Tap every corner you want to work on \u2014 a whole run of wall, jogs and all. Tap open paper to let them go.'
    : 'Drag a picked corner to slide all '+alignSel.length+' as one piece. Tap open paper when done, or the button to flatten them onto one line.';
  if(S.mode==='measure'&&lastWall>=0&&lastWall<segCount())
    return 'Wall '+(lastWall+1)+' selected. Tap it again to type the length, or shoot it with the Disto. Tap open paper to let go.';
  if(S.mode==='measure'&&isInt())return 'Tap a wall to select it, then tap it again for its length \u2014 or shoot it with the Disto. The ceiling is in the Ceiling tab below.';
  if(S.mode==='measure')return 'Tap a wall for its length, or a corner for its grade \u2014 how far the dirt sits below the top of the foundation. Drag a corner to stretch it.';
  if(S.mode==='draw'&&isInt()&&!S.pts.length)
    return cur().shapes.length>1
      ? 'Start '+curShape().name+' against a room you\u2019ve drawn: tap just outside its wall. Then tap each corner as you walk.'
      : 'Tap each corner of '+curShape().name+' as you walk it. Tap the orange first corner to close it.';
  if(S.mode==='open')return 'Tap a wall where a window or door sits to add one. Tap an opening already there to edit or remove it.';
  if(S.snap===90)return 'Tap to place a corner. Drag one onto its neighbour to join them. Drag anywhere else to move the paper.';
  if(S.snap===45)return 'Corners lock to 45\u00b0 steps for clipped corners and angled bays. Dragging a corner keeps every angle.';
  return 'Free angles \u2014 dragging a corner moves just that corner and will change the angles either side of it.';
}

      var gone=curShape().name,ix=jr.active;
      jr.shapes.splice(ix,1);reindexTies(jr,ix);
      jr.active=Math.max(0,Math.min(ix,jr.shapes.length)-1);
      histShape=null;intoState();setMode(S.closed?'measure':'draw');
      say('Took away the empty '+gone+'.');render();
    }
    return;
  }
  var now=filledNow(),was=filledIn(hist[hist.length-1]);
  if(was>=0&&was<now){
    var lost=now-was;
    confirmBox('This would clear measurements',
      'Stepping back that far takes out '+lost+' wall measurement'+(lost>1?'s':'')+
      ' you have already taken. The shape and its lengths move together, so they go with it.',
      'Undo anyway',doUndo);
    return;
  }
  doUndo();
});

function jobStats(j){
  /* walls across every outline (jobs keep outlines in j.shapes; very old
     ones kept a single outline at the top level) */
  var outlines=(j.shapes&&j.shapes.length)?j.shapes:[j];
  var n=0,done=0;
  outlines.forEach(function(sh){
    var c=(!sh.pts||sh.pts.length<2)?0:(sh.closed?sh.pts.length:sh.pts.length-1);
    n+=c;for(var i=0;i<c;i++)if(sh.walls&&sh.walls[i]&&sh.walls[i].len)done++;
  });
  var offj=j.heightsOff||{};
  var wantj=EXT_HEIGHTS.filter(function(h){return !offj[h.k];});
  var hd=wantj.filter(function(h){return j.heights&&j.heights[h.k];}).length;
  /* rooms drawn inside, across every floor */
  var rooms=0;
  if(j.interior&&j.interior.floors)j.interior.floors.forEach(function(f){
    (f.shapes||[]).forEach(function(sh){if(shapeSegs(sh))rooms++;});
  });
  var inside=rooms?(' · '+rooms+' room'+(rooms>1?'s':'')+' inside'):'';
  if(!n)return rooms?('Outside not drawn'+inside):'Nothing drawn yet';
  return done+'/'+n+' walls · '+hd+'/'+wantj.length+' heights'+inside+' · '+
    new Date(j.updated||Date.now()).toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
}

  j.shapes.forEach(function(sh,i){
    /* a red rim means this outline is drawn but not yet placed */
    var untied=needsTie(j,i)&&!tieDone(sh)&&shapeSegs(sh)>0;
    var c=el('button','chip'+(i===j.active?' on':'')+(untied?' untied':''),sh.name+(isInt()&&sh.roomLocked?' 🔒':''));
    /* press and hold any of them for its menu (rename, start over, delete) */
    var held=false,holdT=null;
    c.addEventListener('pointerdown',function(){
      held=false;if(holdT)clearTimeout(holdT);
      holdT=setTimeout(function(){held=true;holdT=null;openShapeMenu(sh,i);},550);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
      c.addEventListener(ev,function(){if(holdT){clearTimeout(holdT);holdT=null;}});
    });
    c.addEventListener('contextmenu',function(e){e.preventDefault();});
    c.addEventListener('click',function(){
      if(held){held=false;return;}
      if(i===j.active)openShapeMenu(sh,i);else switchShape(i);
    });
    bar.appendChild(c);
  });
  var add=el('button','chip add',isInt()?'+ Room':'+ Outline');
  add.addEventListener('click',addShape);
  bar.appendChild(add);
}

intoState();
/* what's on the phone at opening counts as already saved: opening the app
   is not a change */
(function(){var j0=cur(),sh0=curShape();
  if(j0&&sh0){sh0.pts=S.pts;sh0.closed=S.closed;sh0.walls=S.walls;sh0.openings=S.openings;
    j0.heights=S.heights;j0.snap=S.snap;j0.view=V;j0.locked=!!S.locked;}
  try{lastSaved=JSON.stringify(DB);}catch(e){}})();
setMode(S.pts.length&&S.closed?'measure':'draw');
fit();
initCloud();

/* Tapping the header status opens sign-in, or shows who is signed in. */
(function(){
  var s=document.getElementById('sync');
  if(s){s.style.cursor='pointer';
    s.addEventListener('click',function(){ if(window.FMStore) FMStore.prompt(); });}
})();

/* Offline support. Registered last so a failure here cannot stop the app. */
if('serviceWorker' in navigator){
  addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){console.log('[FM] sw',e);});
  });
}
</script>
